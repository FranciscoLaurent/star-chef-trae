<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星厨传承 · 参赛演示片（方向A · 一张卡立传）</title>
<!-- 自托管字体：Noto Serif SC（400/600/900 子集）+ Fraunces 可变字重 -->
<link rel="stylesheet" href="_narration/fonts/400.css">
<link rel="stylesheet" href="_narration/fonts/600.css">
<link rel="stylesheet" href="_narration/fonts/900.css">
<style>
  @font-face{
    font-family:'Fraunces';
    src:url('_narration/_lib/fraunces-var.woff2') format('woff2-variations');
    font-weight:100 900; font-style:normal; font-display:block;
  }
  html,body{margin:0;padding:0;background:#0e0c0a;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  #root{overflow:hidden}
  *{box-sizing:border-box}
</style>
</head>
<body>
<div id="root"></div>

<script>
  // 预览调试通道：?rec=1 时以「录制模式」挂载——时间由 window.__seek(t) 驱动，可确定性定位任意帧
  if (location.search.indexOf("rec=1") !== -1) { window.__recording = true; window.__seekRender = true; }
</script>
<script src="_narration/_lib/react.production.min.js"></script>
<script src="_narration/_lib/react-dom.production.min.js"></script>
<script src="_narration/_lib/babel.min.js"></script>
<script type="text/babel">
/**
 * narration_stage.jsx · 解说驱动 Stage
 *
 * ╔══════════════════════════════════════════════════════════════════╗
 * ║  🛑 用这套工具之前必读：references/voiceover-pipeline.md         ║
 * ║                                                                  ║
 * ║  铁律 #1: 整片是一个连续的运动叙事，不是一组独立场景             ║
 * ║          You are not making 7 slides. You are directing 1 movie. ║
 * ║                                                                  ║
 * ║  铁律 #2: 选定 hero element 跨 scene 持续存在，不要每段一个新布局║
 * ║                                                                  ║
 * ║  铁律 #3: scene 之间禁止硬切（opacity 1→0/0→1）                  ║
 * ║          要 morph，不要 cut                                      ║
 * ║                                                                  ║
 * ║  失败模式 #1（本 skill v1 实战踩坑）：                           ║
 * ║          每个 Scene 各自独立 layout + cue 用 fade-up + scene 切换║
 * ║          整页 opacity 切换 = 带配音的 PowerPoint = 质感归零       ║
 * ║                                                                  ║
 * ║  正确做法：把 hero 直接放在 <NarrationStage> 子级（不进 Scene）  ║
 * ║          用 useNarration() 在 hero 里读 time/scene/cue 状态      ║
 * ║          hero 自己根据当前时间决定形态 → 跨 scene 连续运动       ║
 * ╚══════════════════════════════════════════════════════════════════╝
 *
 * 用法（inline 进 HTML 的 <script type="text/babel">）：
 *   const { NarrationStage, Scene, Cue, useNarration } = NarrationStageLib;
 *
 *   const App = () => (
 *     <NarrationStage timeline={TIMELINE} audioSrc="voiceover.mp3"
 *                     width={1920} height={1080}>
 *       <Scene id="intro">
 *         <h1>什么是 token</h1>
 *         <Cue id="question">
 *           {(triggered) => triggered && <p>↑ 这是问题</p>}
 *         </Cue>
 *       </Scene>
 *       <Scene id="token-2">
 *         <Cue id="split">
 *           {(triggered, progress) => (
 *             <div style={{opacity: triggered ? 1 : 0.3}}>...</div>
 *           )}
 *         </Cue>
 *       </Scene>
 *     </NarrationStage>
 *   );
 *
 * 时间源（自动二选一）：
 *   - 录视频模式（window.__recording === true）：走 window.__time（外部 driver 推帧）
 *   - 实播模式：走 <audio> 的 currentTime（用户点播放时和音频严格同步）
 *
 * 与 render-video.js 兼容：
 *   - tick 第一帧设 window.__ready = true
 *   - 录视频时检测 window.__recording 强制不播 audio、用 window.__time
 *   - 暴露 window.__totalDuration 给 driver 算总帧数
 *
 * 依赖：React 18 + ReactDOM 18 + Babel standalone（同 animations.jsx）
 */

const NarrationStageLib = (() => {
  const NarrationContext = React.createContext({
    time: 0,
    scene: null,
    sceneTime: 0,
    isCueTriggered: () => false,
    cueProgress: () => 0,
  });

  /**
   * 主组件：吃 timeline + audio，提供 context
   *
   * Props:
   *   timeline       timeline.json 对象（必需）
   *   audioSrc       voiceover.mp3 路径（必需）
   *   width/height   Stage 尺寸，默认 1920x1080
   *   background     默认 '#0e0e0e'
   *   controls       是否显示底部播放条，默认 true
   *   children       动画内容（用 <Scene>/<Cue> 组织）
   */
  function NarrationStage({
    timeline,
    audioSrc,
    width = 1920,
    height = 1080,
    background = '#0e0e0e',
    controls = true,
    children,
  }) {
    const audioRef = React.useRef(null);
    const [time, setTime] = React.useState(0);
    const [playing, setPlaying] = React.useState(false);
    const recording = typeof window !== 'undefined' && window.__recording === true;

    // 暴露给 render-video.js
    React.useEffect(() => {
      if (typeof window === 'undefined') return;
      window.__totalDuration = timeline.totalDuration;
      window.__ready = true;
    }, [timeline.totalDuration]);

    // 时间 tick
    React.useEffect(() => {
      let raf;
      if (recording) {
        // Seek-render（render-video-seek.js 注入 window.__seekRender）：冻结自驱时钟，
        // 由外部 window.__seek(t) 逐帧推进。每帧都是确定性 seek，不起 rAF。
        if (typeof window !== 'undefined' && window.__seekRender) {
          window.__seek = (t) => setTime(Math.min(t, timeline.totalDuration));
          return;
        }
        // 录视频模式：rAF wall-clock 自驱动从 0 开始
        // 兼容 render-video.js（它依赖动画自然推进 + window.__seek 复位）
        let startedAt = null;
        const tick = (now) => {
          if (startedAt === null) startedAt = now;
          setTime(Math.min((now - startedAt) / 1000, timeline.totalDuration));
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        // 暴露 __seek 给 render-video.js 在 ready 后调 __seek(0) 复位
        if (typeof window !== 'undefined') {
          window.__seek = (t) => {
            startedAt = performance.now() - t * 1000;
            setTime(t);
          };
        }
      } else {
        // 实播模式：跟随 audio.currentTime
        const tick = () => {
          if (audioRef.current && !audioRef.current.paused) {
            setTime(audioRef.current.currentTime);
          }
          raf = requestAnimationFrame(tick);
        };
        tick();
      }
      return () => cancelAnimationFrame(raf);
    }, [recording, timeline.totalDuration]);

    // 当前 scene
    const currentScene = React.useMemo(() => {
      if (!timeline.scenes) return null;
      // 找到 start <= time < end 的段。最后一段保留到 end
      for (let i = 0; i < timeline.scenes.length; i++) {
        const s = timeline.scenes[i];
        const next = timeline.scenes[i + 1];
        if (time >= s.start && (!next || time < next.start)) return s;
      }
      return timeline.scenes[0];
    }, [time, timeline.scenes]);

    const sceneTime = currentScene ? Math.max(0, time - currentScene.start) : 0;

    // 找 cue 状态（按 absoluteTime 比较，跨 scene 也能查）
    const allCues = React.useMemo(() => {
      const map = {};
      for (const s of timeline.scenes || []) {
        for (const c of s.cues || []) {
          map[c.id] = c;
        }
      }
      return map;
    }, [timeline.scenes]);

    const isCueTriggered = React.useCallback(
      (cueId) => {
        const c = allCues[cueId];
        if (!c) return false;
        return time >= c.absoluteTime;
      },
      [allCues, time],
    );

    /** 触发后多少秒 0→1，>1 后保持 1。用于 cue 后做渐入动画 */
    const cueProgress = React.useCallback(
      (cueId, ramp = 0.5) => {
        const c = allCues[cueId];
        if (!c) return 0;
        const dt = time - c.absoluteTime;
        if (dt <= 0) return 0;
        if (dt >= ramp) return 1;
        return dt / ramp;
      },
      [allCues, time],
    );

    const ctx = { time, scene: currentScene, sceneTime, isCueTriggered, cueProgress, timeline };

    // play/pause/seek 控制
    const handlePlayPause = () => {
      if (!audioRef.current) return;
      if (audioRef.current.paused) {
        audioRef.current.play();
        setPlaying(true);
      } else {
        audioRef.current.pause();
        setPlaying(false);
      }
    };

    const handleSeek = (e) => {
      if (!audioRef.current) return;
      const t = parseFloat(e.target.value);
      audioRef.current.currentTime = t;
      setTime(t);
    };

    const handleAudioEnded = () => setPlaying(false);

    return (
      <NarrationContext.Provider value={ctx}>
        <div
          style={{
            position: 'relative',
            width,
            height,
            background,
            overflow: 'hidden',
            color: '#fff',
            fontFamily: '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif',
          }}
        >
          {children}
        </div>
        {!recording && (
          <audio
            ref={audioRef}
            src={audioSrc}
            preload="auto"
            onEnded={handleAudioEnded}
          />
        )}
        {!recording && controls && (
          <div
            style={{
              display: 'flex',
              alignItems: 'center',
              gap: 12,
              padding: '12px 16px',
              background: '#1a1a1a',
              color: '#ddd',
              fontFamily: 'monospace',
              fontSize: 13,
              width,
              boxSizing: 'border-box',
            }}
          >
            <button
              onClick={handlePlayPause}
              style={{
                padding: '6px 14px',
                background: '#fff',
                color: '#000',
                border: 0,
                borderRadius: 4,
                cursor: 'pointer',
                fontWeight: 600,
              }}
            >
              {playing ? '❚❚ Pause' : '▶ Play'}
            </button>
            <input
              type="range"
              min={0}
              max={timeline.totalDuration}
              step={0.01}
              value={time}
              onChange={handleSeek}
              style={{ flex: 1 }}
            />
            <span style={{ minWidth: 110, textAlign: 'right' }}>
              {time.toFixed(2)} / {timeline.totalDuration.toFixed(2)}s
            </span>
            <span
              style={{
                padding: '4px 10px',
                background: '#2a2a2a',
                borderRadius: 4,
                minWidth: 100,
                textAlign: 'center',
              }}
            >
              {currentScene ? currentScene.id : '—'}
            </span>
          </div>
        )}
      </NarrationContext.Provider>
    );
  }

  /**
   * Scene 包裹器：只在指定 scene id 激活时渲染 children
   *
   * Props:
   *   id        scene id（对应 timeline.scenes[].id）
   *   children  渲染内容；可以是 ReactNode 或 (sceneTime, sceneInfo) => ReactNode
   *   keepMounted 默认 false。设 true 则一直挂载只切换 visibility（动画连贯需要时用）
   */
  function Scene({ id, children, keepMounted = false }) {
    const { scene, sceneTime } = React.useContext(NarrationContext);
    const isActive = scene && scene.id === id;
    if (!isActive && !keepMounted) return null;
    const content = typeof children === 'function' ? children(sceneTime, scene) : children;
    return (
      <div
        style={{
          position: 'absolute',
          inset: 0,
          opacity: isActive ? 1 : 0,
          pointerEvents: isActive ? 'auto' : 'none',
          transition: keepMounted ? 'opacity 0.2s' : undefined,
        }}
      >
        {content}
      </div>
    );
  }

  /**
   * Cue 包裹器：监听 cue 触发状态
   *
   * Props:
   *   id        cue id（对应 timeline.scenes[].cues[].id）
   *   ramp      cue 触发后 progress 0→1 的 ramp 时长（秒），默认 0.5
   *   children  必须是函数：(triggered: bool, progress: 0-1) => ReactNode
   */
  function Cue({ id, ramp = 0.5, children }) {
    const { isCueTriggered, cueProgress } = React.useContext(NarrationContext);
    const triggered = isCueTriggered(id);
    const progress = cueProgress(id, ramp);
    return children(triggered, progress);
  }

  /** Hook：在自定义组件里直接拿 narration 状态 */
  function useNarration() {
    return React.useContext(NarrationContext);
  }

  /**
   * splitChunkToLines · 把一段文字按标点切成 ≤maxLen 字的短行
   *
   * 用于字幕显示——B 站标准是单行 ≤12 字便于阅读。本函数：
   * 1. 先按强标点（。！？\n）切句，绝不跨句号截断
   * 2. 每句 ≤ maxLen 直接用，否则按弱标点（，、；：）切片合并
   * 3. 中英混合：英文/数字按 0.5 字算视觉宽度
   * 4. 兜底硬切（罕见：单个标点段超 maxLen）
   *
   * @param text   原文
   * @param maxLen 单行最大视觉长度，默认 13（≈12 字 + 一个标点）
   * @returns 切好的字幕行数组
   */
  function visualLen(s) {
    let n = 0;
    for (const ch of s) n += /[a-zA-Z0-9 .,'":;\-]/.test(ch) ? 0.5 : 1;
    return n;
  }
  function splitChunkToLines(text, maxLen = 13) {
    const lines = [];
    const sentences = [];
    let buf = '';
    for (const ch of text) {
      buf += ch;
      if ('。！？\n'.includes(ch)) { if (buf.trim()) sentences.push(buf.trim()); buf = ''; }
    }
    if (buf.trim()) sentences.push(buf.trim());
    for (const sent of sentences) {
      if (visualLen(sent) <= maxLen) { lines.push(sent); continue; }
      const parts = [];
      let pbuf = '';
      for (const ch of sent) {
        pbuf += ch;
        if ('，、；：'.includes(ch)) { parts.push(pbuf); pbuf = ''; }
      }
      if (pbuf) parts.push(pbuf);
      let merged = '';
      for (const p of parts) {
        if (visualLen(merged) + visualLen(p) <= maxLen) merged += p;
        else { if (merged) lines.push(merged); merged = p; }
      }
      if (merged) {
        if (visualLen(merged) <= maxLen) lines.push(merged);
        else {
          let hbuf = '';
          for (const ch of merged) { hbuf += ch; if (visualLen(hbuf) >= maxLen) { lines.push(hbuf); hbuf = ''; } }
          if (hbuf) lines.push(hbuf);
        }
      }
    }
    return lines.filter(l => l.trim());
  }

  /**
   * Subtitles · B 站风格字幕组件（白光晕深墨字，无背景，按 chunks 时间显示）
   *
   * 自动从当前 scene.chunks 取活动 chunk，按 splitChunkToLines 切成短行，
   * 按字数比例分配 chunk 时间窗给每行显示。
   *
   * 必需：timeline.scenes[].chunks[]（narrate-pipeline.mjs 已默认输出）
   *
   * Props（可覆盖默认样式）：
   *   bottom    距底部像素，默认 90（不贴边）
   *   fontSize  字号，默认 32
   *   color     字色，默认深墨 #1a1a1a（适合浅纸白底）
   *   haloColor 光晕色，默认 rgba(245,241,232,0.9)（适合 #f5f1e8 底）
   *   maxLen    单行最大视觉长度，默认 13
   *
   * 深底场景：把 color 改成 '#fff'，haloColor 改成 'rgba(0,0,0,0.85)' 即可。
   *
   * 卡拉OK模式（字级高亮，需 timeline chunks 里带 words——narrate-pipeline.mjs 默认输出）：
   *   karaoke       true 开启，默认 false。整行显示，读到哪个字哪个字变色
   *   karaokeColor  已读字的颜色，默认品牌橙 '#e8590c'
   *   chunk 没有 words 数据时自动回落到普通 chunk 模式，调用方不用做判断。
   *   注意：words 是 TN 后文本（"2025"→"二零二五"），卡拉OK行直接由 words 拼出，
   *   保证高亮与发音严格对齐（与 chunk.text 原文可能有差异）。
   */
  function splitWordsToLines(words, maxLen = 13) {
    // 把字级时间戳 token 贪心打包成 ≤maxLen 的行；强标点（。！？）后强制换行，绝不跨句号
    const lines = [];
    let cur = [];
    let curLen = 0;
    for (const w of words) {
      const wLen = visualLen(w.text);
      if (cur.length > 0 && curLen + wLen > maxLen) { lines.push(cur); cur = []; curLen = 0; }
      cur.push(w);
      curLen += wLen;
      if (/[。！？]\s*$/.test(w.text)) { lines.push(cur); cur = []; curLen = 0; }
    }
    if (cur.length > 0) lines.push(cur);
    return lines;
  }

  function Subtitles({ bottom = 90, fontSize = 32, color = '#1a1a1a', haloColor = 'rgba(245,241,232,0.9)', maxLen = 13, karaoke = false, karaokeColor = '#e8590c' } = {}) {
    const { time, scene } = React.useContext(NarrationContext);
    if (!scene || !scene.chunks) return null;
    const active = scene.chunks.find(c => time >= c.absoluteStart && time < c.absoluteEnd);
    if (!active) return null;

    // —— 卡拉OK模式：整行显示 + 逐字高亮（读到即变色，无 CSS transition，seek 渲染确定性）——
    if (karaoke && active.words && active.words.length > 0) {
      const wordLines = splitWordsToLines(active.words, maxLen);
      let activeWLine = wordLines[0];
      for (const ln of wordLines) {
        if (time >= ln[0].absoluteStart) activeWLine = ln;
        else break;
      }
      const lineStart = activeWLine[0].absoluteStart;
      const lineProg = Math.max(0, Math.min(1, (time - (lineStart - 0.15)) / 0.15)); // 行提前 0.15s 淡入
      return React.createElement('div', {
        style: { position: 'absolute', left: 0, right: 0, bottom, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 50 },
      }, React.createElement('div', {
        key: lineStart,
        style: {
          fontFamily: '"PingFang SC", "Noto Sans SC", -apple-system, sans-serif',
          fontSize, fontWeight: 600,
          letterSpacing: '0.04em', lineHeight: 1.2, textAlign: 'center',
          textShadow: `0 0 6px ${haloColor}, 0 0 12px ${haloColor}, 0 1px 2px rgba(255,255,255,0.5)`,
          opacity: lineProg, transform: `translateY(${(1 - lineProg) * 4}px)`,
        },
      }, activeWLine.map((w, i) => React.createElement('span', {
        key: i,
        style: { color: time >= w.absoluteStart ? karaokeColor : color },
      }, w.text))));
    }

    // —— 普通 chunk 模式（原有行为，不变）——
    const lines = splitChunkToLines(active.text, maxLen);
    if (lines.length === 0) return null;
    const totalLen = lines.reduce((s, l) => s + visualLen(l), 0);
    const chunkDur = active.absoluteEnd - active.absoluteStart;
    let acc = active.absoluteStart;
    let activeLine = lines[lines.length - 1];
    let lineStart = active.absoluteStart;
    for (const line of lines) {
      const dur = (visualLen(line) / totalLen) * chunkDur;
      if (time < acc + dur) { activeLine = line; lineStart = acc; break; }
      acc += dur;
    }
    const lineProg = Math.min(1, (time - lineStart) / 0.15);
    return React.createElement('div', {
      style: { position: 'absolute', left: 0, right: 0, bottom, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 50 },
    }, React.createElement('div', {
      key: lineStart,
      style: {
        fontFamily: '"PingFang SC", "Noto Sans SC", -apple-system, sans-serif',
        fontSize, fontWeight: 600, color,
        letterSpacing: '0.04em', lineHeight: 1.2, textAlign: 'center',
        textShadow: `0 0 6px ${haloColor}, 0 0 12px ${haloColor}, 0 1px 2px rgba(255,255,255,0.5)`,
        opacity: lineProg, transform: `translateY(${(1 - lineProg) * 4}px)`,
      },
    }, activeLine));
  }

  /**
   * useSceneFade · scene 内辅助元素的软淡入淡出 helper
   *
   * 铁律第二条要求 scene 之间禁止硬切——但 scene 内辅助元素（数据卡、引用块）
   * 一旦 cue 触发后默认会一直亮到 scene 结束。如果不淡出，离开本段进入下段时
   * 这些元素会突兀地存在或瞬间消失。本 hook 提供 [入场淡入 → hold → 出场淡出] 的统一软切换。
   *
   * 用法（把 op 乘进辅助元素的 opacity）：
   *   const op = useSceneFade('md-side', 0.6, 0.8);  // 进 0.6s, 出 0.8s
   *   <Cue id="agents-md">{(t, p) => (
   *     <div style={{ opacity: op * p }}>...</div>
   *   )}</Cue>
   *
   * 这样数据卡片在 md-side 段开始 0.6s 内淡入，在段结束前 0.8s 开始淡出，
   * 与下一段的辅助元素淡入形成 overlap，画面不出现硬切。
   *
   * @param sceneId  scene id
   * @param fadeIn   入场淡入秒数（默认 0.5）
   * @param fadeOut  出场淡出秒数（默认 0.5）
   * @returns 0-1 之间的不透明度倍率
   */
  function useSceneFade(sceneId, fadeIn = 0.5, fadeOut = 0.5) {
    const { time, timeline } = React.useContext(NarrationContext);
    if (!timeline) return 0;
    const s = timeline.scenes.find(x => x.id === sceneId);
    if (!s) return 0;
    const inT = (time - s.start) / fadeIn;
    const outT = (s.end - time) / fadeOut;
    const v = Math.min(1, Math.min(inT, outT));
    return Math.max(0, v);
  }

  return { NarrationStage, Scene, Cue, useNarration, useSceneFade, Subtitles, splitChunkToLines, splitWordsToLines };
})();

if (typeof window !== 'undefined') {
  Object.assign(window, { NarrationStageLib });
}

</script>

<script type="text/babel">
const { NarrationStage, Scene, Cue, useNarration, Subtitles, splitChunkToLines } = NarrationStageLib;

/* ───────── 时间轴（实测） ─────────

// 运行时补 chunks（等比铺时，与 build_timeline 同口径）
RAW.scenes = RAW.scenes.map(s => {
  const dur = s.end - s.start;   // RAW 无 duration 字段，必须现场算（此前用 s.duration 得 NaN，字幕全程失效）
  const lines = splitChunkToLines(s.text, 13);
  const total = lines.reduce((a, l) => a + l.length, 0) || 1;
  let t = s.start;
  const chunks = lines.map(l => {
    const d = dur * l.length / total;
    const c = { text: l, start: t - s.start, end: t - s.start + d, absoluteStart: t, absoluteEnd: t + d };
    t += d; return c;
  });
  return { ...s, duration: dur, chunks, cues: s.cues.map(([id, absoluteTime]) => ({ id, absoluteTime })) };
});

/* ───────── 工具 ───────── */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const expoOut = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const PAPER = "#F5F0E6", INK = "#1A1714", VERM = "#B03A2E", MOSS = "#5B6B4F", GOLD = "#C9A24A";
const SERIF = "'Noto Serif SC','Fraunces','Songti SC',serif";

  "s01-hook":      { x:50, y:64, w:560, op:0, phase:0 },
  "s02-problem":   { x:50, y:52, w:640, op:0, phase:0 },
  "s03-product":   { x:50, y:51, w:760, op:1,   phase:1 },
  "s04-lineage":   { x:20, y:48, w:540, op:1,   phase:2 },

  "s08-ai":        { x:61, y:51, w:730, op:1,   phase:3 },
  "s09-community": { x:17, y:72, w:430, op:1,   phase:3 },
  "s10-vision":    { x:50, y:50, w:600, op:1,   phase:3 },

};
/* 每镜摄像机（镜内 settle，禁尾漂） */
const CAM_KEYS = {
  "s01-hook":1.045, "s02-problem":1.09, "s03-product":1.22, "s04-lineage":1.03,
  "s05-honest":1.1, "s06-source":1.1, "s07-jobs":1.03, "s08-ai":1.06,
  "s09-community":1.05, "s10-vision":1.05, "s11-end":1.01,
};
/* 聚光中心覆盖（默认跟随 hero 卡）：辅助面板为主角的镜头，聚光让位 */
const SPOT_KEYS = { "s04-lineage":[58,45], "s07-jobs":[60,45], "s09-community":[62,42] };
/* 每镜聚光/暗角强度 */
const VIGNETTE = {
  "s01-hook":.34, "s02-problem":.32, "s03-product":.34, "s04-lineage":.3,
  "s05-honest":.36, "s06-source":.3, "s07-jobs":.3, "s08-ai":.3,
  "s09-community":.3, "s10-vision":.34, "s11-end":.38,
};

const useSceneInfo = () => {
  const { time, scene } = useNarration();
  const idx = RAW.scenes.findIndex(s => s.id === scene?.id);
  const cur = scene || RAW.scenes[0];
  const prev = RAW.scenes[Math.max(0, idx - 1)];
  const sceneTime = time - cur.start;
  const settle = expoOut(clamp(sceneTime / 0.9));
  return { time, cur, prev, sceneTime, settle, idx };
};

/* ───────── 聚光 & 纸纹 & 摄像机 ───────── */
function Atmosphere() {
  const { time, cur, prev, settle } = useSceneInfo();
  const k = HERO_KEYS[cur.id], kp = HERO_KEYS[prev.id] || k;
  const over = SPOT_KEYS[cur.id], overP = SPOT_KEYS[prev.id] || over;
  const vx = over ? lerp(overP[0], over[0], settle) : lerp(kp.x, k.x, settle);
  const vy = over ? lerp(overP[1], over[1], settle) : lerp(kp.y, k.y, settle);
  const a = lerp(VIGNETTE[prev.id] ?? .5, VIGNETTE[cur.id] ?? .5, settle);
  const drift = Math.sin(time * 0.14) * 12;
  return (
    <div style={{ position:"absolute", inset:0, pointerEvents:"none" }}>
      {/* 纸纹（feTurbulence 噪点，缓慢漂移） */}
      <svg width="1920" height="1080" style={{ position:"absolute", opacity:.05, transform:`translateX(${drift}px)` }}>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" /></filter>
        <rect width="100%" height="100%" filter="url(#grain)" />
      </svg>
      {/* 聚光（跟随卡心，柔和但保持纸面清晰） */}
      <div style={{
        position:"absolute", inset:0,
        background:`radial-gradient(ellipse 52% 58% at ${vx}% ${vy}%, rgba(255,250,238,.05) 0%, rgba(255,250,238,0) 55%, rgba(12,9,6,${a}) 88%)`,
      }} />
    </div>
  );
}

function CameraRig({ children }) {
  const { cur, prev, sceneTime } = useSceneInfo();
  const dur = Math.max((cur.end ?? 0) - (cur.start ?? 0), 1);
  // settle 冲到本镜目标后继续单调缓推，全片无静止镜头
  const z = lerp(CAM_KEYS[prev.id] ?? 1, CAM_KEYS[cur.id] ?? 1, expoOut(clamp(sceneTime / (dur * 0.55))))
          + 0.006 * clamp((sceneTime - dur * 0.55) / (dur * 0.45));
  return <div style={{ position:"absolute", inset:0, transform:`scale(${z})`, willChange:"transform" }}>{children}</div>;
}

            }}>
              <div style={{ fontSize:30, fontWeight:900, color:"rgba(26,23,20,.75)" }}>{name}</div>
              <div style={{ fontSize:14, color:"rgba(26,23,20,.5)", marginTop:8, letterSpacing:2 }}>师承档案 · 职业匹配 · 口述简历</div>
            </div>
          </div>
        );
      })}
      <div style={{
        position:"absolute", left:"50%", bottom:"9%", transform:"translateX(-50%)",
        fontFamily:SERIF, fontSize:24, fontWeight:600, color:INK, letterSpacing:6,
        opacity:expoOut(clamp((time - 95.5) / 0.9)),
      }}>
        帮助每一种「手艺型」职业<span style={{ color:VERM }}>。</span>
      </div>
    </div>
  );
}

/* ───────── 镜 11 谢幕（纯产品收束） ───────── */
function EndCard() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s11-end") return null;
  const t1 = clamp((time - 100.4) / 0.9);
  const t2 = clamp((time - 101.6) / 0.9);
  const t3 = clamp((time - 103.155) / 0.6);   // cue:brand
  return (
    <div style={{ position:"absolute", left:"50%", top:"44%", transform:"translate(-50%,-50%)", textAlign:"center", fontFamily:SERIF }}>
      <div style={{ fontSize:15, letterSpacing:8, color:"rgba(26,23,20,.5)", opacity:expoOut(t1) }}>
        STAR CHEF · 数字师承谱
      </div>
      <div style={{
        fontSize:120, fontWeight:900, color:INK, letterSpacing:10, lineHeight:1.25,
        opacity:expoOut(t1), transform:`scale(${1.04 - 0.04 * expoOut(t1)})`,
      }}>
        星厨<span style={{ color:VERM }}>传承</span>
      </div>
      <div style={{ fontSize:24, color:"rgba(26,23,20,.65)", marginTop:18, letterSpacing:6, opacity:expoOut(t2) }}>
        以师承为信用
      </div>
      <div style={{
        fontSize:34, fontWeight:600, color:INK, marginTop:30, letterSpacing:6,
        opacity:expoOut(t3), transform:`translateY(${(1 - expoOut(t3)) * 14}px) scale(${1.08 - 0.08 * expoOut(t3)})`,
      }}>
        让每一门手艺，都有出处<span style={{ color:VERM }}>。</span>
      </div>
    </div>
  );
}

/* ───────── 主装配 ───────── */
function TimeProbe() {
  const { time, cur } = useSceneInfo();
  if (!window.__recording || location.search.indexOf("rec=1") === -1) return null;  // 仅 rec=1 调试显示，不进渲染
  return (
    <div style={{ position:"absolute", right:14, top:12, fontFamily:"Consolas,monospace",
      fontSize:15, color:"rgba(26,23,20,.55)", background:"rgba(245,240,230,.7)",
      padding:"3px 10px", borderRadius:3, zIndex:50 }}>
      t={time.toFixed(2)}s · {cur.id}
    </div>
  );
}

/* 开场两镜题词带已逐字承载解说词，底部字幕带隐藏避免重叠 */
function Subs() {
  const { scene } = useNarration();
  if (scene && ["s01-hook","s02-problem"].includes(scene.id)) return null;
  return <Subtitles bottom={72} fontSize={31} color="#1a1a1a" haloColor="rgba(245,240,230,0.92)" />;
}

const App = () => (
  <NarrationStage timeline={RAW} audioSrc="_narration/voiceover.mp3"
    width={1920} height={1080} background={PAPER} controls={true}>
    <div style={{ position:"absolute", inset:0, background:PAPER }} />
    <CameraRig>
      <FacesWall />
      <TitleBand />
      <S02Resume />
      <HeroCard />
      <LineagePanel />
      <LineageSweep />
      <WaitBadge />
      <SourceCard />
      <BreakdownPanel />
      <TypingBubble />
      <CommunityWall />
      <VisionShadows />
      <EndCard />
    </CameraRig>
    <Atmosphere />
    <Subs />
    <TimeProbe />
  </NarrationStage>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
