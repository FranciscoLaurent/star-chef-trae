<script type="text/babel">
/**
 * 风格 C · 一张谱，一群人 · 解说驱动 Stage
 *
 * 视觉骨架：一张 8900×1500 的「数字师承谱」长卷从 t=0 演到片尾。
 * 镜头 = 斜置平面上的纪录片摄影机：每镜 settle(expoOut 1.4s) 后保持
 * dx/dz 单调推进（全片无 >2s 静止，唯一例外片尾末帧）。
 * 每段旁白对应长卷上一处「局部特写」；屏幕层只放批注与字幕。
 */
const NarrationStageLib = (() => {
  const NarrationContext = React.createContext({
    time: 0, scene: null, sceneTime: 0,
    isCueTriggered: () => false, cueProgress: () => 0,
  });

  function NarrationStage({ timeline, audioSrc, width = 1920, height = 1080, background = '#0e0e0e', controls = true, children }) {
    const audioRef = React.useRef(null);
    const [time, setTime] = React.useState(0);
    const [playing, setPlaying] = React.useState(false);
    const recording = typeof window !== 'undefined' && window.__recording === true;

    React.useEffect(() => {
      if (typeof window === 'undefined') return;
      window.__totalDuration = timeline.totalDuration;
      window.__ready = true;
    }, [timeline.totalDuration]);

    React.useEffect(() => {
      let raf;
      if (recording) {
        if (typeof window !== 'undefined' && window.__seekRender) {
          window.__seek = (t) => setTime(Math.min(t, timeline.totalDuration));
          return;
        }
        let startedAt = null;
        const tick = (now) => {
          if (startedAt === null) startedAt = now;
          setTime(Math.min((now - startedAt) / 1000, timeline.totalDuration));
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        if (typeof window !== 'undefined') {
          window.__seek = (t) => { startedAt = performance.now() - t * 1000; setTime(t); };
        }
      } else {
        const tick = () => {
          if (audioRef.current && !audioRef.current.paused) setTime(audioRef.current.currentTime);
          raf = requestAnimationFrame(tick);
        };
        tick();
      }
      return () => cancelAnimationFrame(raf);
    }, [recording, timeline.totalDuration]);

    const currentScene = React.useMemo(() => {
      if (!timeline.scenes) return null;
      for (let i = 0; i < timeline.scenes.length; i++) {
        const s = timeline.scenes[i];
        const next = timeline.scenes[i + 1];
        if (time >= s.start && (!next || time < next.start)) return s;
      }
      return timeline.scenes[0];
    }, [time, timeline.scenes]);

    const sceneTime = currentScene ? Math.max(0, time - currentScene.start) : 0;
    const allCues = React.useMemo(() => {
      const map = {};
      for (const s of timeline.scenes || []) for (const c of s.cues || []) map[c.id] = c;
      return map;
    }, [timeline.scenes]);
    const isCueTriggered = React.useCallback((cueId) => {
      const c = allCues[cueId];
      return c ? time >= c.absoluteTime : false;
    }, [allCues, time]);
    const cueProgress = React.useCallback((cueId, ramp = 0.5) => {
      const c = allCues[cueId];
      if (!c) return 0;
      const dt = time - c.absoluteTime;
      if (dt <= 0) return 0;
      return dt >= ramp ? 1 : dt / ramp;
    }, [allCues, time]);

    const ctx = { time, scene: currentScene, sceneTime, isCueTriggered, cueProgress, timeline };

    const handlePlayPause = () => {
      if (!audioRef.current) return;
      if (audioRef.current.paused) { audioRef.current.play(); setPlaying(true); }
      else { audioRef.current.pause(); setPlaying(false); }
    };
    const handleSeek = (e) => {
      if (!audioRef.current) return;
      const t = parseFloat(e.target.value);
      audioRef.current.currentTime = t;
      setTime(t);
    };

    return (
      <NarrationContext.Provider value={ctx}>
        <div style={{ position: 'relative', width, height, background, overflow: 'hidden', color: '#fff' }}>
          {children}
        </div>
        {!recording && <audio ref={audioRef} src={audioSrc} preload="auto" />}
        {!recording && controls && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: '#1a1a1a', color: '#ddd', fontFamily: 'monospace', fontSize: 13, width, boxSizing: 'border-box' }}>
            <button onClick={handlePlayPause} style={{ padding: '6px 14px', background: '#fff', color: '#000', border: 0, borderRadius: 4, cursor: 'pointer', fontWeight: 600 }}>
              {playing ? '❚❚ Pause' : '▶ Play'}
            </button>
            <input type="range" min={0} max={timeline.totalDuration} step={0.01} value={time} onChange={handleSeek} style={{ flex: 1 }} />
            <span style={{ minWidth: 110, textAlign: 'right' }}>{time.toFixed(2)} / {timeline.totalDuration.toFixed(2)}s</span>
            <span style={{ padding: '4px 10px', background: '#2a2a2a', borderRadius: 4, minWidth: 100, textAlign: 'center' }}>{currentScene ? currentScene.id : '—'}</span>
          </div>
        )}
      </NarrationContext.Provider>
    );
  }

  function Cue({ id, ramp = 0.5, children }) {
    const { isCueTriggered, cueProgress } = React.useContext(NarrationContext);
    return children(isCueTriggered(id), cueProgress(id, ramp));
  }
  function useNarration() { return React.useContext(NarrationContext); }

  function visualLen(s) { let n = 0; for (const ch of s) n += /[a-zA-Z0-9 .,'":;\-]/.test(ch) ? 0.5 : 1; return n; }
  function splitChunkToLines(text, maxLen = 13) {
    const lines = []; const sentences = []; let buf = '';
    for (const ch of text) { buf += ch; if ('。！？\n'.includes(ch)) { if (buf.trim()) sentences.push(buf.trim()); buf = ''; } }
    if (buf.trim()) sentences.push(buf.trim());
    for (const sent of sentences) {
      if (visualLen(sent) <= maxLen) { lines.push(sent); continue; }
      const parts = []; let pbuf = '';
      for (const ch of sent) { pbuf += ch; if ('，、；：'.includes(ch)) { parts.push(pbuf); pbuf = ''; } }
      if (pbuf) parts.push(pbuf);
      let merged = '';
      for (const p of parts) {
        if (visualLen(merged) + visualLen(p) <= maxLen) merged += p;
        else { if (merged) lines.push(merged); merged = p; }
      }
      if (merged) {
        if (visualLen(merged) <= maxLen) lines.push(merged);
        else { let hbuf = ''; for (const ch of merged) { hbuf += ch; if (visualLen(hbuf) >= maxLen) { lines.push(hbuf); hbuf = ''; } } if (hbuf) lines.push(hbuf); }
      }
    }
    return lines.filter(l => l.trim());
  }
  function splitWordsToLines(words, maxLen = 13) {
    const lines = []; let cur = []; let curLen = 0;
    for (const w of words) {
      const wLen = visualLen(w.text);
      if (cur.length > 0 && curLen + wLen > maxLen) { lines.push(cur); cur = []; curLen = 0; }
      cur.push(w); curLen += wLen;
      if (/[。！？]\s*$/.test(w.text)) { lines.push(cur); cur = []; curLen = 0; }
    }
    if (cur.length > 0) lines.push(cur);
    return lines;
  }
  function Subtitles({ bottom = 90, fontSize = 32, color = '#1a1a1a', haloColor = 'rgba(245,241,232,0.9)', maxLen = 13 } = {}) {
    const { time, scene } = React.useContext(NarrationContext);
    if (!scene || !scene.chunks) return null;
    const active = scene.chunks.find(c => time >= c.absoluteStart && time < c.absoluteEnd);
    if (!active) return null;
    const lines = splitChunkToLines(active.text, maxLen);
    if (lines.length === 0) return null;
    const totalLen = lines.reduce((s, l) => s + visualLen(l), 0);
    const chunkDur = active.absoluteEnd - active.absoluteStart;
    let acc = active.absoluteStart;
    let activeLine = lines[lines.length - 1];
    let lineStart = active.absoluteStart;
    for (const line of lines) {
      const dur = (visualLen(line) / totalLen) * chunkDur;
      if (time < acc + dur) { activeLine = line; lineStart = acc; break; }
      acc += dur;
    }
    const lineProg = Math.min(1, (time - lineStart) / 0.15);
    return React.createElement('div', {
      style: { position: 'absolute', left: 0, right: 0, bottom, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 50 },
    }, React.createElement('div', {
      key: lineStart,
      style: {
        fontFamily: '"PingFang SC", "Noto Sans SC", -apple-system, sans-serif',
        fontSize, fontWeight: 600, color,
        letterSpacing: '0.04em', lineHeight: 1.2, textAlign: 'center',
        textShadow: `0 0 6px ${haloColor}, 0 0 12px ${haloColor}, 0 2px 4px rgba(10,8,5,0.9)`,
        opacity: lineProg, transform: `translateY(${(1 - lineProg) * 4}px)`,
      },
    }, activeLine));
  }

  return { NarrationStage, Cue, useNarration, Subtitles, splitChunkToLines };
})();

if (typeof window !== 'undefined') Object.assign(window, { NarrationStageLib });
</script>

/* ───────── 摄像机：每镜 start + drift（settle 后单调推进） ───────── */
const SETTLE = 1.4;
const CAM = {
  "s01-hook":      { x:250,  y:690, z:1.30, rx:9,  ry:-6,  dx:36, dz:0.006 },
  "s02-crowd":     { x:820,  y:800, z:1.00, rx:10, ry:-8,  dx:26, dz:0.005 },
  "s03-scroll":    { x:1500, y:740, z:0.86, rx:11, ry:-9,  dx:44, dz:0.004 },
  "s04-lineage":   { x:2255, y:690, z:1.22, rx:9,  ry:-6,  dx:20, dz:0.002 },
  "s05-honest":    { x:3290, y:810, z:1.30, rx:10, ry:-7,  dx:12, dz:0.004 },
  "s06-source":    { x:3830, y:740, z:1.16, rx:9,  ry:-6,  dx:22, dz:0.003 },
  "s07-jobs":      { x:4750, y:770, z:1.10, rx:9,  ry:-6,  dx:10, dz:0.002 },
  "s08-ai":        { x:6100, y:760, z:1.06, rx:8,  ry:-5,  dx:8,  dz:0.0015 },
  "s09-community": { x:7480, y:750, z:1.02, rx:8,  ry:-5,  dx:22, dz:0.002 },
  "s10-vision":    { x:8180, y:720, z:0.88, rx:10, ry:-7,  dx:16, dz:0.002 },
  "s11-end":       { x:4450, y:750, z:0.44, rx:14, ry:-10, dx:0,  dz:0.003 },
};
const SCENE_ORDER = RAW.scenes.map(s => s.id);
const camEndOf = (id) => {
  const c = CAM[id], dur = RAW.scenes.find(s => s.id === id).duration;
  return { x: c.x + c.dx * (dur - SETTLE), y: c.y, z: c.z + c.dz * (dur - SETTLE), rx: c.rx, ry: c.ry };
};
const VIGNETTE = { "s01-hook":.5, "s02-crowd":.44, "s03-scroll":.36, "s04-lineage":.32, "s05-honest":.3,
  "s06-source":.3, "s07-jobs":.3, "s08-ai":.3, "s09-community":.34, "s10-vision":.42, "s11-end":.5 };

const useSceneInfo = () => {
  const { time, scene } = useNarration();
  const idx = RAW.scenes.findIndex(s => s.id === scene?.id);
  const cur = scene || RAW.scenes[0];
  const sceneTime = time - cur.start;
  return { time, cur, sceneTime, idx };
};

function useCam() {
  const { time, cur, sceneTime, idx } = useSceneInfo();
  const k = CAM[cur.id];
  const prevId = SCENE_ORDER[Math.max(0, idx - 1)];
  const prevEnd = idx === 0 ? k : camEndOf(prevId);
  const st = expoOut(clamp(sceneTime / SETTLE));
  const dt = idx === 0 ? Math.max(0, sceneTime) : Math.max(0, sceneTime - SETTLE);
  const tx = k.x + k.dx * dt, tz = k.z + k.dz * dt;
  let x = lerp(prevEnd.x, tx, st), y = lerp(prevEnd.y, k.y, st), z = lerp(prevEnd.z, tz, st);
  let rx = lerp(prevEnd.rx, k.rx, st), ry = lerp(prevEnd.ry, k.ry, st);
  // s11 收拢：卷面合拢下滑（rx 增加 + z 收 + 下沉 + 内容褪至近无）
  let fold = 0;
  if (cur.id === "s11-end") {
    fold = expoOut(clamp((time - 103.4) / 1.7));
    rx += fold * 34; z *= (1 - 0.35 * fold); y += fold * 430;
  }
  const vig = lerp(VIGNETTE[prevId] ?? .5, VIGNETTE[cur.id] ?? .5, st);
  return { x, y, z, rx, ry, vig, fold };
}

      {/* 摄像机：perspective 外壳 + 斜置长卷 */}
      <div style={{ position: "absolute", inset: 0, perspective: "1600px", perspectiveOrigin: "50% 42%" }}>
        <div style={{
          position: "absolute", left: 0, top: 0, width: SCROLL_W, height: SCROLL_H,
          transformOrigin: "0 0", willChange: "transform",
          transform: `translate3d(960px, 540px, 0) scale3d(${cam.z},${cam.z},${cam.z}) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg) translate3d(${-cam.x}px, ${-cam.y}px, 0)`,
          opacity: 1 - 0.8 * cam.fold,
        }}>
          {/* 卷面纸底 */}
          <div style={{
            position: "absolute", inset: 0, background: PAPER,
            background: "linear-gradient(180deg, #F7F2E8 0%, #F5F0E6 45%, #EFE7D6 100%)",
            borderTop: `3px solid ${INK}`, borderBottom: `3px solid ${INK}`,
            boxShadow: "0 60px 160px rgba(0,0,0,.55)",
          }} />
          {/* 卷缝折叶界线 */}
          {FOLDS.map((fx) => (
            <div key={fx} style={{
              position: "absolute", left: fx - 1, top: 0, bottom: 0, width: 2,
              background: "rgba(26,23,20,.32)",
              boxShadow: `inset 1px 0 0 rgba(255,255,255,.35), -8px 0 14px rgba(26,23,20,.1)`,
            }} />
          ))}
          {/* 内容层（收拢时褪色） */}
          <div style={{ position: "absolute", inset: 0, opacity: contentOp }}>
            <ZoneWall time={time} />
            <ZoneTree time={time} />
            <ZoneColophon time={time} />
            <ZoneMatch time={time} />
            <ZoneDictation time={time} />
            <ZoneCommunity time={time} />
            <ZoneEnd time={time} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── 屏幕层批注（每镜 ≤2，随 cue 进出） ───────── */
function S01Titles() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s01-hook") return null;
  const t1 = expoOut(clamp((time - 1.982) / 0.7));
  const t2 = expoOut(clamp((time - 3.558) / 0.7));
  const out = clamp((time - 6.0) / 0.7);
  return (
    <div style={{ position: "absolute", inset: 0, fontFamily: SERIF, pointerEvents: "none" }}>
      <div style={{
        position: "absolute", left: "13%", top: "12%",
        writingMode: "vertical-rl", fontSize: 92, fontWeight: 900, color: PAPER, letterSpacing: ".16em",
        textShadow: "0 4px 30px rgba(10,8,5,.8)",
        opacity: t1 * (1 - out), filter: `blur(${out * 10}px)`,
        transform: `translateY(${(1 - t1) * 20}px)`,
      }}>
        你是谁带的
      </div>
      <div style={{
        position: "absolute", left: "25%", top: "64%",
        fontSize: 30, fontWeight: 400, color: "rgba(245,240,230,.5)", letterSpacing: ".1em",
        opacity: t2 * (1 - out) * 0.85, filter: `blur(${1 + out * 10}px)`,
        transform: `translateY(${(1 - t2) * 14}px)`,
      }}>
        往往比「你在哪里干过」更重要
      </div>
      {/* 朱批小签 */}
      <div style={{
        position: "absolute", left: "17.5%", top: "12.5%", width: 3, height: 460,
        background: VERM, opacity: t1 * (1 - out), boxShadow: "0 0 14px rgba(176,58,46,.5)",
      }} />
    </div>
  );
}

function S02Unwritten() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s02-crowd") return null;
  const t = expoOut(clamp((time - 14.964) / 0.6));
  const out = clamp((time - 16.9) / 0.6);
  return (
    <div style={{
      position: "absolute", left: "21%", top: "72%", fontFamily: SERIF, pointerEvents: "none",
      opacity: t * (1 - out), filter: `blur(${out * 8}px)`,
    }}>
      <div style={{
        display: "inline-block", padding: "12px 26px", border: "1.5px dashed rgba(245,240,230,.75)",
        borderRadius: 4, color: "rgba(245,240,230,.95)", fontSize: 26, letterSpacing: 6,
        background: "rgba(12,10,7,.78)", boxShadow: "0 6px 24px rgba(10,8,5,.5)",
      }}>
        未成谱 <span style={{ color: "rgba(245,240,230,.65)", fontSize: 19, letterSpacing: 2 }}>来路悬而未接</span>
      </div>
    </div>
  );
}

function S05Slogan() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s05-honest") return null;
  const t = expoOut(clamp((time - 42.3) / 0.7));
  const out = clamp((time - 43.9) / 0.55);
  return (
    <div style={{
      position: "absolute", left: "50%", top: "78%", transform: "translateX(-50%)", fontFamily: SERIF,
      pointerEvents: "none", whiteSpace: "nowrap",
      fontSize: 30, fontWeight: 600, color: INK, letterSpacing: 6,
      textShadow: "0 1px 0 rgba(245,240,230,.6), 0 6px 24px rgba(245,240,230,.5)",
      opacity: t * (1 - out),
    }}>
      宁可谱瘦<span style={{ color: VERM }}>，</span>不让谱说谎。
    </div>
  );
}

function S10Vision() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s10-vision") return null;
  const t0 = expoOut(clamp((time - 92.7) / 0.7));
  const out0 = clamp((time - 94.4) / 0.55);
  const cards = [["木匠", 26], ["绣娘", 50], ["理发师", 74]];
  return (
    <div style={{ position: "absolute", inset: 0, fontFamily: SERIF, pointerEvents: "none" }}>
      <div style={{
        position: "absolute", left: "50%", top: "12%", transform: "translateX(-50%)",
        fontSize: 26, fontWeight: 600, color: "#46583C", letterSpacing: 6, whiteSpace: "nowrap",
        textShadow: "0 1px 0 rgba(245,240,230,.55), 0 8px 26px rgba(245,240,230,.5)",
        opacity: t0 * (1 - out0),
      }}>
        让不擅表达的劳动者被看见
      </div>
      {cards.map(([name, x], i) => {
        const t = expoOut(clamp((time - 95.075 - i * 0.18) / 0.7));
        const out = clamp((time - 101.3) / 0.7);
        return (
          <div key={name} style={{
            position: "absolute", left: `${x}%`, top: `${37 + (i === 1 ? -5 : 2)}%`,
            transform: `translate(-50%,-50%) translateY(${(1 - t) * 34}px)`,
            opacity: t * 0.88 * (1 - out), width: 300,
          }}>
            <div style={{
              background: "rgba(245,240,230,.94)", border: "1.5px dashed rgba(26,23,20,.55)", borderRadius: 6,
              padding: "24px 26px", textAlign: "center", boxShadow: "0 16px 50px rgba(10,8,5,.55)",
            }}>
              <div style={{ fontSize: 29, fontWeight: 900, color: "rgba(26,23,20,.8)" }}>{name}</div>
              <div style={{ fontSize: 12.5, color: "rgba(26,23,20,.5)", marginTop: 7, letterSpacing: 2 }}>
                师承档案 · 职业匹配 · 口述简历
              </div>
            </div>
          </div>
        );
      })}
      <div style={{
        position: "absolute", left: "50%", top: "78%", transform: "translateX(-50%)",
        fontSize: 26, fontWeight: 600, color: INK, letterSpacing: 6, whiteSpace: "nowrap",
        textShadow: "0 1px 0 rgba(245,240,230,.55), 0 8px 26px rgba(245,240,230,.5)",
        opacity: expoOut(clamp((time - 97.5) / 0.7)) * (1 - clamp((time - 101.3) / 0.7)),
      }}>
        帮助每一种「手艺型」职业<span style={{ color: VERM }}>。</span>
      </div>
    </div>
  );
}

/* 片尾：长卷收拢 → 谱书 + 字标 + 标语 */
function S11End() {
  const { time, cur } = useSceneInfo();
  if (cur.id !== "s11-end") return null;
  const bT = expoOut(clamp((time - 105.6) / 0.8));
  const t1 = expoOut(clamp((time - 106.006) / 0.8));
  const t2 = expoOut(clamp((time - 106.8) / 0.6));
  const t3 = expoOut(clamp((time - 107.0) / 0.6));
  return (
    <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      {/* 谱书（宋刻本封面：签条 + 朱印） */}
      <div style={{
        position: "absolute", left: "27%", top: "47%", transform: `translate(-50%,-50%) scale(${0.72 + 0.28 * bT}) rotate(${(1 - bT) * -3}deg)`,
        opacity: bT, width: 300, height: 420, fontFamily: SERIF,
      }}>
        <div style={{
          position: "absolute", inset: 0, background: "linear-gradient(160deg, #F7F2E8 0%, #F1E8D4 100%)",
          border: `3px solid ${INK}`, boxShadow: "0 30px 90px rgba(10,8,5,.7)",
        }} />
        <div style={{ position: "absolute", inset: 7, border: `1px solid rgba(26,23,20,.6)` }} />
        <div style={{
          position: "absolute", right: 26, top: 26, width: 62, height: 300, background: PAPER2,
          border: `1px solid rgba(26,23,20,.65)`, display: "flex", alignItems: "center", justifyContent: "center",
          writingMode: "vertical-rl", fontSize: 21, letterSpacing: ".24em", color: INK, fontWeight: 600,
          boxShadow: "0 3px 12px rgba(26,23,20,.3)",
        }}>
          星厨传承 · 数字师承谱
        </div>
        <div style={{
          position: "absolute", right: 40, bottom: 30, width: 40, height: 40, background: VERM, color: PAPER,
          display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, borderRadius: 4,
          boxShadow: "0 3px 10px rgba(120,30,20,.5)",
        }}>谱</div>
        <div style={{
          position: "absolute", left: 30, bottom: 34, writingMode: "vertical-rl",
          fontSize: 14, color: "rgba(26,23,20,.5)", letterSpacing: ".3em",
        }}>以师承为信用</div>
      </div>
      {/* 字标 */}
      <div style={{
        position: "absolute", left: "58%", top: "40%", transform: "translate(-50%,-50%)", fontFamily: SERIF,
        textAlign: "center", whiteSpace: "nowrap",
      }}>
        <div style={{ fontSize: 15, letterSpacing: 8, color: GOLD, opacity: t2 }}>
          STAR CHEF · 数字师承谱
        </div>
        <div style={{
          fontSize: 104, fontWeight: 900, color: PAPER, letterSpacing: 12, lineHeight: 1.3,
          opacity: t1, transform: `scale(${1.06 - 0.06 * t1})`,
          textShadow: "0 6px 40px rgba(10,8,5,.65)",
        }}>
          星厨<span style={{ color: VERM }}>传承</span>
        </div>
        <div style={{
          fontSize: 30, fontWeight: 600, color: "rgba(245,240,230,.88)", marginTop: 20, letterSpacing: 8,
          opacity: t3, transform: `translateY(${(1 - t3) * 14}px)`,
        }}>
          一张谱<span style={{ color: VERM }}>，</span>一群人。
        </div>
      </div>
    </div>
  );
}

/* ───────── 氛围：纸纹 + 暗角 + 黑场起 ───────── */
function Atmosphere() {
  const { time } = useSceneInfo();
  const cam = useCam();
  const tEff = Math.min(time, 108);
  const drift = Math.sin(tEff * 0.14) * 12;
  const vig = cam.vig + cam.fold * 0.08;
  return (
    <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
      <svg width="1920" height="1080" style={{ position: "absolute", opacity: 0.055, transform: `translateX(${drift}px)` }}>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" /></filter>
        <rect width="100%" height="100%" filter="url(#grain)" />
      </svg>
      <div style={{
        position: "absolute", inset: 0,
        background: `radial-gradient(ellipse 58% 64% at 50% 44%, rgba(20,17,13,0) 0%, rgba(20,17,13,0) 52%, rgba(10,8,5,${vig}) 88%)`,
      }} />
    </div>
  );
}

function FadeFromBlack() {
  const { time } = useSceneInfo();
  const op = 1 - clamp(time / 1.1);
  if (op <= 0) return null;
  return <div style={{ position: "absolute", inset: 0, background: "#0a0806", opacity: op, pointerEvents: "none", zIndex: 40 }} />;
}

function TimeProbe() {
  const { time, cur } = useSceneInfo();
  if (!window.__recording || location.search.indexOf("rec=1") === -1) return null;
  return (
    <div style={{
      position: "absolute", right: 14, top: 12, fontFamily: "Consolas,monospace",
      fontSize: 15, color: "rgba(245,240,230,.75)", background: "rgba(15,12,8,.7)",
      padding: "3px 10px", borderRadius: 3, zIndex: 50,
    }}>
      t={time.toFixed(2)}s · {cur.id}
    </div>
  );
}

/* ───────── 主装配 ───────── */
const App = () => (
  <NarrationStage timeline={RAW} audioSrc="_narration/voiceover.mp3"
    width={1920} height={1080} background={BOARD} controls={true}>
    <ScrollWorld />
    <S01Titles />
    <S02Unwritten />
    <S05Slogan />
    <S10Vision />
    <S11End />
    <Atmosphere />
    <FadeFromBlack />
    <Subtitles bottom={64} fontSize={31} color="#F2EDE2" haloColor="rgba(10,8,5,0.9)" />
    <TimeProbe />
  </NarrationStage>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
