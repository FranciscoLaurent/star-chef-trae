<script type="text/babel">
/**
 * 风格B · 从口述到档案 —— Stripe 式因果双联舞台
 *
 * 视觉合同（design-demos/dir-2.html）：
 *   双联分屏（左联=因 / 右联=果）· 一根流程线贯穿全片 · 干净编辑风 · 纸墨+朱红点缀
 * 叙事引擎是「过程」本身：口述涌出 → 因果转化 → 档案显影 → 谱链/匹配/社区同构分叉。
 *
 * 技术约定：
 *   - 全部时间常量来自 _narration/timeline_inline.js（build_timeline.py 实测，cue/beat 词级对齐）
 *   - 所有动画都是 time 的纯函数（?rec=1 + window.__seek 确定性渲染）
 *   - 摄像机每镜持续缓推（settle 后仍保持 0.5-1.5%/s 单调推进），镜内动效错峰
 *   - chunks 由 build_timeline.py 按实测时长在 Python 侧切好（规避主版 s.duration NaN 坑）
 */

const { useState, useEffect, useMemo, useRef } = React;

/* ───────── NarrationStageLib（内联精简版：file:// 下 XHR 被禁，必须内联） ───────── */
const NarrationStageLib = (() => {
  const NarrationContext = React.createContext({ time: 0, scene: null, sceneTime: 0 });

  function NarrationStage({ timeline, audioSrc, width = 1920, height = 1080, background = '#0e0e0e', controls = true, children }) {
    const audioRef = React.useRef(null);
    const [time, setTime] = React.useState(0);
    const [playing, setPlaying] = React.useState(false);
    const recording = typeof window !== 'undefined' && window.__recording === true;

    React.useEffect(() => {
      if (typeof window === 'undefined') return;
      window.__totalDuration = timeline.totalDuration;
      window.__ready = true;
    }, [timeline.totalDuration]);

    React.useEffect(() => {
      let raf;
      if (recording) {
        if (typeof window !== 'undefined' && window.__seekRender) {
          window.__seek = (t) => setTime(Math.min(t, timeline.totalDuration));
          return;
        }
        let startedAt = null;
        const tick = (now) => {
          if (startedAt === null) startedAt = now;
          setTime(Math.min((now - startedAt) / 1000, timeline.totalDuration));
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        if (typeof window !== 'undefined') {
          window.__seek = (t) => { startedAt = performance.now() - t * 1000; setTime(t); };
        }
      } else {
        const tick = () => {
          if (audioRef.current && !audioRef.current.paused) setTime(audioRef.current.currentTime);
          raf = requestAnimationFrame(tick);
        };
        tick();
      }
      return () => cancelAnimationFrame(raf);
    }, [recording, timeline.totalDuration]);

    const currentScene = React.useMemo(() => {
      if (!timeline.scenes) return null;
      for (let i = 0; i < timeline.scenes.length; i++) {
        const s = timeline.scenes[i];
        const next = timeline.scenes[i + 1];
        if (time >= s.start && (!next || time < next.start)) return s;
      }
      return timeline.scenes[0];
    }, [time, timeline.scenes]);

    const ctx = { time, scene: currentScene, sceneTime: currentScene ? Math.max(0, time - currentScene.start) : 0, timeline };

    const handlePlayPause = () => {
      if (!audioRef.current) return;
      if (audioRef.current.paused) { audioRef.current.play(); setPlaying(true); }
      else { audioRef.current.pause(); setPlaying(false); }
    };
    const handleSeek = (e) => { if (audioRef.current) { const t = parseFloat(e.target.value); audioRef.current.currentTime = t; setTime(t); } };

    return (
      <NarrationContext.Provider value={ctx}>
        <div style={{ position: 'relative', width, height, background, overflow: 'hidden', color: '#1A1714' }}>
          {children}
        </div>
        {!recording && <audio ref={audioRef} src={audioSrc} preload="auto" />}
        {!recording && controls && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: '#1a1a1a', color: '#ddd', fontFamily: 'monospace', fontSize: 13, width, boxSizing: 'border-box' }}>
            <button onClick={handlePlayPause} style={{ padding: '6px 14px', background: '#fff', color: '#000', border: 0, borderRadius: 4, cursor: 'pointer', fontWeight: 600 }}>
              {playing ? '❚❚ Pause' : '▶ Play'}
            </button>
            <input type="range" min={0} max={timeline.totalDuration} step={0.01} value={time} onChange={handleSeek} style={{ flex: 1 }} />
            <span style={{ minWidth: 110, textAlign: 'right' }}>{time.toFixed(2)} / {timeline.totalDuration.toFixed(2)}s</span>
            <span style={{ padding: '4px 10px', background: '#2a2a2a', borderRadius: 4, minWidth: 120, textAlign: 'center' }}>{currentScene ? currentScene.id : '—'}</span>
          </div>
        )}
      </NarrationContext.Provider>
    );
  }

  function useNarration() { return React.useContext(NarrationContext); }

  function visualLen(s) { let n = 0; for (const ch of s) n += /[a-zA-Z0-9 .,'":;\-]/.test(ch) ? 0.5 : 1; return n; }
  function splitChunkToLines(text, maxLen = 13) {
    const lines = []; const sentences = []; let buf = '';
    for (const ch of text) { buf += ch; if ('。！？\n'.includes(ch)) { if (buf.trim()) sentences.push(buf.trim()); buf = ''; } }
    if (buf.trim()) sentences.push(buf.trim());
    for (const sent of sentences) {
      if (visualLen(sent) <= maxLen) { lines.push(sent); continue; }
      const parts = []; let pbuf = '';
      for (const ch of sent) { pbuf += ch; if ('，、；：'.includes(ch)) { parts.push(pbuf); pbuf = ''; } }
      if (pbuf) parts.push(pbuf);
      let merged = '';
      for (const p of parts) {
        if (visualLen(merged) + visualLen(p) <= maxLen) merged += p;
        else { if (merged) lines.push(merged); merged = p; }
      }
      if (merged) {
        if (visualLen(merged) <= maxLen) lines.push(merged);
        else { let hbuf = ''; for (const ch of merged) { hbuf += ch; if (visualLen(hbuf) >= maxLen) { lines.push(hbuf); hbuf = ''; } } if (hbuf) lines.push(hbuf); }
      }
    }
    return lines.filter(l => l.trim());
  }

  /** Subtitles · 白光晕深墨字字幕（chunks 由 build_timeline 实测切好） */
  function Subtitles({ bottom = 64, fontSize = 30, color = '#1a1a1a', haloColor = 'rgba(245,240,230,0.92)', maxLen = 13 } = {}) {
    const { time, scene } = React.useContext(NarrationContext);
    if (!scene || !scene.chunks) return null;
    const active = scene.chunks.find(c => time >= c.absoluteStart && time < c.absoluteEnd);
    if (!active) return null;
    const lines = splitChunkToLines(active.text, maxLen);
    if (lines.length === 0) return null;
    const totalLen = lines.reduce((s, l) => s + visualLen(l), 0);
    const chunkDur = active.absoluteEnd - active.absoluteStart;
    let acc = active.absoluteStart;
    let activeLine = lines[lines.length - 1];
    let lineStart = active.absoluteStart;
    for (const line of lines) {
      const dur = (visualLen(line) / totalLen) * chunkDur;
      if (time < acc + dur) { activeLine = line; lineStart = acc; break; }
      acc += dur;
    }
    const lineProg = Math.min(1, (time - lineStart) / 0.15);
    return (
      <div style={{ position: 'absolute', left: 0, right: 0, bottom, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 80 }}>
        <div key={lineStart} style={{
          fontFamily: '"Noto Sans SC","PingFang SC",sans-serif',
          fontSize, fontWeight: 600, color,
          letterSpacing: '0.04em', lineHeight: 1.25, textAlign: 'center',
          textShadow: `0 0 6px ${haloColor}, 0 0 12px ${haloColor}, 0 1px 2px rgba(255,255,255,0.5)`,
          opacity: lineProg, transform: `translateY(${(1 - lineProg) * 4}px)`,
        }}>{activeLine}</div>
      </div>
    );
  }

  return { NarrationStage, useNarration, Subtitles, splitChunkToLines, visualLen };
})();

/* ───────── 时间轴（实测，来自 timeline_inline.js） ───────── */
const { NarrationStage, useNarration, Subtitles } = NarrationStageLib;
const TL = window.__TL;

if (TL) {
  var TL_SCENES = TL.scenes.map(s => ({
    ...s,
    cuesMap: s.cues,
    cues: Object.entries(s.cues).map(([id, absoluteTime]) => ({ id, absoluteTime })),
  }));
  var TL_RAW = { title: TL.title, totalDuration: TL.totalDuration, voiceover: TL.voiceover, scenes: TL_SCENES };
  var SC = id => TL_SCENES.find(x => x.id === id);
}

/* ───────── 工具 ───────── */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const expoOut = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const PAPER = "#F5F0E6", INK = "#1A1714", VERM = "#B03A2E", MOSS = "#5B6B4F", GOLD = "#C9A24A";
const SERIF = "'Noto Serif SC','Fraunces','Songti SC',serif";
const NUMF = "'Fraunces','Noto Serif SC',serif";

const useSceneInfo = () => {
  const { time, scene } = useNarration();
  const idx = TL_SCENES.findIndex(s => s.id === scene?.id);
  const cur = scene || TL_SCENES[0];
  const prev = TL_SCENES[Math.max(0, idx - 1)];
  const st = time - cur.start;
  const settle = expoOut(clamp(st / 0.9));
  const prog = clamp(st / cur.duration);
  return { time, cur, prev, st, settle, prog, idx };
};
/* 场景内 cue / beat 的绝对秒（实测） */
const ct = (cur, id) => (cur.cuesMap && cur.cuesMap[id] !== undefined) ? cur.cuesMap[id] : 1e9;
const bt = (cur, name) => (cur.beats && cur.beats[name] !== undefined) ? cur.beats[name] : 1e9;
/* 跨场景取 beat：兼容短 id（"s05" → "s05-lineage"） */
function B(sid, name) {
  const s = TL_SCENES.find(x => x.id === sid || x.id.startsWith(sid + "-"));
  return s && s.beats ? (s.beats[name] ?? 1e9) : 1e9;
}

/* 跨场景引用的全局节拍 */
const B1 = SC("s01-hook").beats, B2 = SC("s02-problem").beats, B3 = SC("s03-turn").beats, B4 = SC("s04-card").beats;
/* 口述 chips 的全局出现时刻（s01 词级对齐） */
const CHIP_T = [B1.wave + 0.5, B1.wave + 1.4, B1.chunk1, B1.chunk2 + 0.1, B1.chunk3 + 0.1];
/* 档案卡行的落地时刻（s03 航班 + s04 词级对齐） */
const ROW_T = {
  years: B3.flow + 0.78,          // 航班0「三十年刀工」落地
  hand: B3.flow + 1.44,           // 航班1「文思豆腐」落地
  apprent: B3.flow + 2.10,        // 航班2「带过20多个徒弟」落地
  intent: B3.flow + 2.55,
};

/* ───────── 场景几何键 ───────── */
/* 口述面板 */
const TALK_KEYS = {
  "s01-hook":      { x: 26, y: 54, w: 700, op: 1 },
  "s02-problem":   { x: 17, y: 50, w: 560, op: 0.4 },
  "s03-turn":      { x: 25, y: 53, w: 680, op: 1 },
  "s04-card":      { x: 18, y: 50, w: 540, op: 0.75 },
  "s05-lineage":   { x: 10, y: 50, w: 480, op: 0 },
  "s06-source":    { x: 10, y: 50, w: 480, op: 0 },
  "s07-jobs":      { x: 12, y: 50, w: 480, op: 0 },
  "s08-community": { x: 12, y: 50, w: 480, op: 0 },
  "s09-vision":    { x: 20, y: 50, w: 480, op: 0 },
  "s10-merge":     { x: 40, y: 46, w: 520, op: 0.9 },
  "s11-end":       { x: 40, y: 46, w: 520, op: 0 },
};
/* 简历面板 */
const RESUME_KEYS = {
  "s01-hook":      { x: 75, y: 54, w: 520, op: 1 },
  "s02-problem":   { x: 66, y: 49, w: 640, op: 1 },
  "s03-turn":      { x: 69, y: 51, w: 640, op: 0 },
  "s04-card":      { x: 69, y: 51, w: 640, op: 0 },
  "s05-lineage":   { x: 69, y: 51, w: 640, op: 0 },
  "s06-source":    { x: 69, y: 51, w: 640, op: 0 },
  "s07-jobs":      { x: 69, y: 51, w: 640, op: 0 },
  "s08-community": { x: 69, y: 51, w: 640, op: 0 },
  "s09-vision":    { x: 69, y: 51, w: 640, op: 0 },
  "s10-merge":     { x: 50, y: 45, w: 560, op: 0 },
  "s11-end":       { x: 50, y: 45, w: 560, op: 0 },
};
/* 档案卡（hero） */
const CARD_KEYS = {
  "s01-hook":      { x: 69, y: 51, w: 640, op: 0, phase: 1 },
  "s02-problem":   { x: 69, y: 51, w: 640, op: 0, phase: 1 },
  "s03-turn":      { x: 70, y: 51, w: 640, op: 1, phase: 1 },
  "s04-card":      { x: 71, y: 52, w: 690, op: 1, phase: 3 },
  "s05-lineage":   { x: 18, y: 50, w: 430, op: 1, phase: 3 },
  "s06-source":    { x: 17, y: 66, w: 380, op: 0.45, phase: 3 },
  "s07-jobs":      { x: 21, y: 50, w: 450, op: 1, phase: 3 },
  "s08-community": { x: 15, y: 78, w: 400, op: 0.9, phase: 3 },
  "s09-vision":    { x: 30, y: 52, w: 450, op: 1, phase: 3 },
  "s10-merge":     { x: 50, y: 45, w: 560, op: 1, phase: 3 },
  "s11-end":       { x: 30, y: 50, w: 420, op: 0, phase: 3 },
};
/* 摄像机：每镜持续缓推 + 缓移（settle 后保持单调推进） */
const CAM_KEYS = {
  "s01-hook":      { z0: 1.00, rate: 0.008, ox: 50, oy: 47, ox2: 53, oy2: 48 },
  "s02-problem":   { z0: 1.02, rate: 0.010, ox: 55, oy: 50, ox2: 60, oy2: 52 },
  "s03-turn":      { z0: 1.03, rate: 0.010, ox: 50, oy: 48, ox2: 55, oy2: 50 },
  "s04-card":      { z0: 1.05, rate: 0.008, ox: 60, oy: 50, ox2: 66, oy2: 50 },
  "s05-lineage":   { z0: 1.03, rate: 0.009, ox: 52, oy: 48, ox2: 58, oy2: 48 },
  "s06-source":    { z0: 1.06, rate: 0.008, ox: 55, oy: 46, ox2: 60, oy2: 45 },
  "s07-jobs":      { z0: 1.04, rate: 0.009, ox: 55, oy: 48, ox2: 60, oy2: 48 },
  "s08-community": { z0: 1.03, rate: 0.008, ox: 54, oy: 46, ox2: 59, oy2: 47 },
  "s09-vision":    { z0: 1.04, rate: 0.009, ox: 50, oy: 46, ox2: 56, oy2: 46 },
  "s10-merge":     { z0: 1.02, rate: 0.010, ox: 50, oy: 46, ox2: 50, oy2: 46 },
  "s11-end":       { z0: 1.04, rate: 0.005, ox: 50, oy: 45, ox2: 50, oy2: 45 },
};
const camEnd = c => c.z0 * (1 + c.rate * c.duration);
/* 中央流程线（双联分隔） */
const FLOW_KEYS = {
  "s01-hook": [52, 0.45], "s02-problem": [38, 0.32], "s03-turn": [50, 1.0], "s04-card": [45, 0.85],
  "s05-lineage": [30.5, 0.55], "s06-source": [35, 0.5], "s07-jobs": [34, 0.55], "s08-community": [30, 0.5],
  "s09-vision": [48, 0.4], "s10-merge": [50, 0.8], "s11-end": [50, 0],
};
/* 双联栏题（因 / 果） */
const COL_KEYS = {
  "s01-hook":      ["因 · 一门手艺", "果 · 一张简历", 1],
  "s02-problem":   ["因 · 一门手艺", "果 · 一张简历", 1],
  "s03-turn":      ["因 · 口述", "果 · 档案", 1],
  "s04-card":      ["因 · 口述", "果 · 档案", 1],
  "s05-lineage":   ["因 · 档案", "果 · 师承谱", 1],
  "s06-source":    ["因 · 师承", "果 · 出处", 1],
  "s07-jobs":      ["因 · 档案", "果 · 匹配", 1],
  "s08-community": ["因 · 师门", "果 · 同行", 1],
  "s09-vision":    ["因 · 一门手艺", "果 · 被看见", 1],
  "s10-merge":     ["因 · 口说", "果 · 有凭", 1],
  "s11-end":       ["", "", 0],
};
/* 暗角强度 */
const VIGN = {
  "s01-hook": .30, "s02-problem": .32, "s03-turn": .26, "s04-card": .28, "s05-lineage": .28,
  "s06-source": .30, "s07-jobs": .28, "s08-community": .28, "s09-vision": .30, "s10-merge": .30, "s11-end": .34,
};

const useDividerX = () => {
  const { cur, prev, settle } = useSceneInfo();
  const k = FLOW_KEYS[cur.id], kp = FLOW_KEYS[prev.id] || k;
  return lerp(kp[0], k[0], settle);
};

const morphKeys = KEYS => {
  const { cur, prev, settle } = useSceneInfo();
  const b = KEYS[cur.id], a = KEYS[prev.id] || b;
  return {
    x: lerp(a.x, b.x, settle), y: lerp(a.y, b.y, settle), w: lerp(a.w, b.w, settle),
    op: lerp(a.op ?? 1, b.op ?? 1, settle), phase: b.phase, b,
  };
};
const place = (k, extra = {}) => ({
  position: "absolute", left: `${k.x}%`, top: `${k.y}%`, width: k.w,
  transform: "translate(-50%,-50%)", ...extra,
});

/* ───────── 舞台家具：纸纹 + 聚光/暗角 ───────── */
function Atmosphere() {
  const { time, cur, prev, settle } = useSceneInfo();
  const a = lerp(VIGN[prev.id] ?? .3, VIGN[cur.id] ?? .3, settle);
  const drift = Math.sin(time * 0.14) * 10;
  return (
    <div style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 60 }}>
      <svg width="1920" height="1080" style={{ position: "absolute", opacity: .045, transform: `translate(${drift}px,${Math.cos(time * 0.1) * 6}px)` }}>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" /></filter>
        <rect width="100%" height="100%" filter="url(#grain)" />
      </svg>
      <div style={{
        position: "absolute", inset: 0,
        background: `radial-gradient(ellipse 60% 64% at 50% 44%, rgba(255,250,238,.05) 0%, rgba(255,250,238,0) 55%, rgba(12,9,6,${a}) 92%)`,
      }} />
    </div>
  );
}

/* ───────── 中央流程线（贯穿全片的因果线） ───────── */
function FlowLine() {
  const { time, cur } = useSceneInfo();
  const x = useDividerX();
  const k = FLOW_KEYS[cur.id];
  const o = k[1];
  if (o <= 0.01) return null;
  const flowT = B3.flow;
  const boost = Math.max(0, 1 - (time - (flowT + 0.05)) / 1.6);   // s03 点火增亮
  const speed = 9 * (1 + boost * 2.2);
  const chevs = [0, 1, 2].map(i => {
    const ph = ((time * (0.05 + 0.045 * boost)) + i / 3) % 1;
    return { y: 14 + ph * 72, a: Math.sin(ph * Math.PI) * (0.55 + 0.45 * boost) };
  });
  const hot = boost > 0.06;
  return (
    <div style={{ position: "absolute", left: `${x}%`, top: "13%", bottom: "11%", width: 0, opacity: Math.min(1, o * (1 + boost * 0.5)), zIndex: 12 }}>
      <svg width="44" height="100%" viewBox="0 0 44 800" preserveAspectRatio="none"
        style={{ position: "absolute", left: -22, top: 0, height: "100%", overflow: "visible" }}>
        <line x1="22" y1="0" x2="22" y2="800" stroke={hot ? "rgba(176,58,46,.55)" : "rgba(26,23,20,.3)"}
          strokeWidth="1.6" strokeDasharray="3 7" strokeDashoffset={-time * speed} />
        {chevs.map((c, i) => (
          <path key={i} d="M17 -5 L27 0 L17 5" transform={`translate(0 ${(c.y / 100) * 800})`}
            fill="none" stroke={hot ? VERM : "rgba(26,23,20,.5)"} strokeWidth="2.2"
            opacity={Math.min(1, c.a)} strokeLinecap="round" strokeLinejoin="round" />
        ))}
      </svg>
    </div>
  );
}

/* ───────── 双联栏题（因 / 果） ───────── */
function ColumnHeads() {
  const { cur, prev, settle } = useSceneInfo();
  const k = COL_KEYS[cur.id], kp = COL_KEYS[prev.id] || k;
  const x = useDividerX();
  if (k[2] <= 0 && kp[2] <= 0) return null;
  const Head = ({ txt, cx, op, rise }) => txt ? (
    <div style={{

}

  );
}

/* ───────── 调试探针（仅 ?rec=1&probe=1 的 QA 会话显示；正式渲染只传 rec=1，不带水印/探针） ───────── */
function TimeProbe() {
  const { time, cur } = useSceneInfo();
  if (!window.__recording || location.search.indexOf("probe=1") === -1) return null;
  return (
    <div style={{ position: "absolute", right: 14, top: 12, fontFamily: "Consolas,monospace", fontSize: 15, color: "rgba(26,23,20,.6)", background: "rgba(245,240,230,.75)", padding: "3px 10px", borderRadius: 3, zIndex: 90 }}>
      t={time.toFixed(2)}s · {cur.id}
    </div>
  );
}

/* ───────── 摄像机 ───────── */
function CameraRig({ children }) {
  const { cur, prev, st, settle } = useSceneInfo();
  const c = CAM_KEYS[cur.id], p = CAM_KEYS[prev.id] || c;
  const zNow = c.z0 * (1 + c.rate * Math.max(0, st));
  const z = lerp(camEnd(p), zNow, settle);
  const oxNow = lerp(c.ox, c.ox2, clamp(st / cur.duration));
  const oyNow = lerp(c.oy, c.oy2, clamp(st / cur.duration));
  const ox = lerp(p.ox2, oxNow, settle), oy = lerp(p.oy2, oyNow, settle);
  return (
    <div style={{ position: "absolute", inset: 0, transform: `scale(${z})`, transformOrigin: `${ox}% ${oy}%`, willChange: "transform" }}>
      {children}
    </div>
  );
}

/* ───────── 主装配 ───────── */
const App = () => {
  if (!window.__TL) {
    return (
      <div style={{ width: 1920, height: 1080, background: PAPER, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: SERIF, fontSize: 26, color: INK }}>
        _narration/timeline_inline.js 未生成——请先运行 python _narration/scripts/build_timeline.py
      </div>
    );
  }
  return (
    <NarrationStage timeline={TL_RAW} audioSrc="_narration/voiceover.mp3" width={1920} height={1080} background={PAPER} controls={true}>
      <div style={{ position: "absolute", inset: 0, background: PAPER }} />
      <CameraRig>
        <FlowLine />
        <ColumnHeads />
        <TalkDoc />
        <ResumeDoc />
        <ArchiveCard />
        <FlowCross />
        <BigTitle />
        <SloganBar />
        <LineageSheet />
        <SourceScene />
        <MatchSheet />
        <CommunityScene />
        <CraftShadows />
        <MergeFinale />
        <EndCard />
      </CameraRig>
      <Atmosphere />
      <Subtitles bottom={64} fontSize={30} color="#1a1a1a" haloColor="rgba(245,240,230,0.92)" />
      <TimeProbe />
    </NarrationStage>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
